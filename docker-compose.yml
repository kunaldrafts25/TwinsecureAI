version: '3.8'

services:
  # =============================================================================
  # Note: Using SQLite by default - no database container needed
  # PostgreSQL can be enabled by setting DATABASE_TYPE=postgres and uncommenting the db service below
  # =============================================================================
  # db:
  #   image: postgres:15-alpine
  #   container_name: twinsecure_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  #     POSTGRES_DB: ${POSTGRES_DB:-twinsecure}
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - twinsecure_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-twinsecure}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: twinsecure_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    networks:
      - twinsecure_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # =============================================================================
  # PgAdmin (Database Management UI) - Only needed for PostgreSQL
  # =============================================================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: twinsecure_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@twinsecure.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - twinsecure_network
  #   restart: unless-stopped
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin

  # =============================================================================
  # Backend API (FastAPI)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinsecure_backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./models:/app/models
    env_file:
      - .env
    environment:
      # Database (SQLite by default)
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-./twinsecure.db}
      # PostgreSQL settings (only needed if DATABASE_TYPE=postgres)
      - POSTGRES_SERVER=${POSTGRES_SERVER:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-twinsecure}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_DB=0
      
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      
      # Admin User
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@twinsecure.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      
      # CORS
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      
      # File Paths
      - MAXMIND_DB_PATH=${MAXMIND_DB_PATH:-data/GeoLite2-City.mmdb}
      - REPORTS_DIR=reports
      - LOGS_DIR=logs
      - DATA_DIR=data
      - ML_MODELS_DIR=models
      
      # External APIs
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      
      # Email
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME:-TwinSecure AI}
      - ALERT_RECIPIENTS=${ALERT_RECIPIENTS:-[]}
      
      # Application Settings
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-true}
      
      # Feature Flags
      - ENABLE_ML=${ENABLE_ML:-false}
      - ENABLE_ALERTING=${ENABLE_ALERTING:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING:-true}
      - ENABLE_ML_TRAINING=${ENABLE_ML_TRAINING:-false}
      
      # Cache Settings
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - CACHE_PREFIX=${CACHE_PREFIX:-twinsecure:}
      
      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-100/minute}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      # db service only needed if using PostgreSQL
      # db:
      #   condition: service_healthy
    networks:
      - twinsecure_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo '📦 Setting up database...' &&
        python scripts/setup_database.py || echo 'Database setup completed or skipped' &&
        echo '👤 Creating admin user...' &&
        export ADMIN_USER_PASSWORD=$${FIRST_SUPERUSER_PASSWORD:-admin123} &&
        python scripts/create_admin_user_fixed.py || echo 'Admin user creation completed or skipped' &&
        echo '🚀 Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # =============================================================================
  # Frontend (React/Vite)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twinsecure_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - twinsecure_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Prometheus (Metrics Collection)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: twinsecure_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - twinsecure_network
    restart: unless-stopped
    depends_on:
      - backend

  # =============================================================================
  # Grafana (Metrics Visualization)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: twinsecure_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
    networks:
      - twinsecure_network
    restart: unless-stopped

  # =============================================================================
  # Elasticsearch (Logging)
  # =============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: twinsecure_elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - twinsecure_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

# =============================================================================
# Networks
# =============================================================================
networks:
  twinsecure_network:
    driver: bridge
    name: twinsecure_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # PostgreSQL volumes (only needed if using PostgreSQL)
  # postgres_data:
  #   name: twinsecure_postgres_data
  # pgadmin_data:
  #   name: twinsecure_pgadmin_data
  redis_data:
    name: twinsecure_redis_data
  grafana_data:
    name: twinsecure_grafana_data
  prometheus_data:
    name: twinsecure_prometheus_data
  elasticsearch_data:
    name: twinsecure_elasticsearch_data
